services:
  cowrie:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cowrie-honeypot
    restart: unless-stopped
    ports:
      - "${COWRIE_PORT:-2222}:2222"
    volumes:
      - ./logs:/cowrie/cowrie-git/var/log/cowrie
    networks:
      - istmo_soc_net

networks:
  istmo_soc_net:
    external: true
