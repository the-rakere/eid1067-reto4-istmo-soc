services:
  waf_perimetral:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: waf_modsec
    restart: unless-stopped
    ports:
      - "${WAF_PORT:-80}:8080"
    environment:
      - PROXY_LOCATION=http://dvwa_backend:80
      - BACKEND=http://dvwa_backend:80
      - SEC_RULE_ENGINE=On
      - MODSEC_AUDIT_LOG=/var/log/modsec/audit.log
    volumes:
      - ./logs:/var/log/modsec
    networks:
      - dmz_net

networks:
  dmz_net:
    external: true
